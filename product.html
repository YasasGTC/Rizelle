<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Product — RIZELLE</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shop.css">

  <style>
    .detail {
      padding: 135px 6.5% 100px;
      max-width: 1450px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      font-size: 9px;
      letter-spacing: 2px;
      border-bottom: 1px solid #111;
      padding-bottom: 5px;
    }

    .detailGrid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: start;
    }

    .detailVisual {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      background-color: #eee;
    }

    .detailVisual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.15),
        transparent 35%
      );
      pointer-events: none;
    }

    .detailVisual .badge {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      background: #fff;
      color: #111;
      padding: 9px 12px;
      font-size: 8px;
      letter-spacing: 1.5px;
    }

    .detailInfo {
      padding-top: 20px;
      max-width: 550px;
    }

    .detailInfo > small {
      color: #888;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .detailInfo h1 {
      font: 500 clamp(42px,5vw,72px)/.95
        'Playfair Display', serif;
      letter-spacing: -2px;
      margin: 18px 0;
    }

    .price {
      font-size: 15px;
      letter-spacing: .5px;
      margin-bottom: 30px;
    }

    .price del {
      color: #999;
      margin-left: 12px;
      font-size: 12px;
    }

    .detailInfo > p {
      color: #777;
      font-size: 13px;
      line-height: 2;
      max-width: 480px;
      margin-bottom: 35px;
    }

    .sizeTitle {
      font-size: 9px;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .sizes {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .sizeBtn {
      width: 52px;
      height: 48px;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .sizeBtn:hover,
    .sizeBtn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .bigAdd {
      width: 100%;
      background: #111;
      color: #fff;
      padding: 18px;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: .2s;
    }

    .bigAdd:hover {
      background: #333;
    }

    .detailsLines {
      margin-top: 35px;
      border-top: 1px solid #eee;
    }

    .detailsLines > div {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
      font-size: 9px;
      letter-spacing: 1.5px;
    }

    .detailsLines span {
      float: right;
      color: #999;
      letter-spacing: 0;
      font-size: 9px;
    }

    @media(max-width:850px) {
      .detail {
        padding: 105px 6% 70px;
      }

      .detailGrid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .detailInfo {
        padding-top: 0;
      }
    }

    @media(max-width:520px) {
      .detail {
        padding: 95px 5% 60px;
      }

      .detailVisual {
        aspect-ratio: 4 / 5;
      }

      .detailInfo h1 {
        font-size: 44px;
      }

      .detailsLines span {
        float: none;
        display: block;
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    <img src="assets/rizelle-logo.jpg" alt="RIZELLE">
  </a>

  <nav id="nav">
    <a href="index.html">HOME</a>
    <a href="shop.html">SHOP</a>
    <a href="index.html#outlet">FACTORY OUTLET</a>
    <a href="index.html#story">OUR STORY</a>
    <a href="index.html#contact">CONTACT</a>
  </nav>

  <div class="actions">
    <a href="orders.html">ORDERS</a>
    <a href="shop.html">← SHOP</a>
    <a href="bag.html">
      BAG <b data-bag-count>0</b>
    </a>

    <button
      class="menu"
      onclick="
        document.getElementById('nav')
        .classList.toggle('open')
      "
    >
      ☰
    </button>
  </div>

</header>


<main id="detail" class="detail"></main>

<div id="toast"></div>


<script src="products.js"></script>

<script>

  let selectedSize = "M";

  function addSelectedToBag(id) {

    const p =
      PRODUCTS.find(x => x.id === id);

    if (!p) return;

    let bag = getBag();

    const item =
      bag.find(
        x =>
          x.id === id &&
          x.size === selectedSize
      );

    if (item) {

      item.qty++;

    } else {

      bag.push({
        id: id,
        qty: 1,
        size: selectedSize
      });

    }

    saveBag(bag);

    toast(
      p.name +
      " — Size " +
      selectedSize +
      " added to bag."
    );
  }


  const id =
    new URLSearchParams(location.search)
    .get("id") || "rz-001";


  const p =
    PRODUCTS.find(x => x.id === id)
    || PRODUCTS[0];


  document.title =
    p.name + " — RIZELLE";


  document.getElementById("detail")
    .innerHTML = `

      <a class="back" href="shop.html">
        ← BACK TO SHOP
      </a>

      <div class="detailGrid">

        <div
          class="detailVisual"
          style="
            background-image:
            url('${p.image}');
          "
        >

          ${
            p.badge
              ? `
                <b class="badge">
                  ${p.badge}
                </b>
              `
              : ""
          }

        </div>


        <div class="detailInfo">

          <small>
            ${p.category} / ${p.color}
          </small>


          <h1>
            ${p.name}
          </h1>


          <div class="price">

            ${money(p.price)}

            ${
              p.oldPrice
                ? `
                  <del>
                    ${money(p.oldPrice)}
                  </del>
                `
                : ""
            }

          </div>


          <p>
            ${p.desc}
          </p>


          <div class="sizeTitle">
            SELECT SIZE
          </div>


          <div class="sizes">

            ${["S","M","L","XL"].map(
              s => `
                <button
                  class="sizeBtn
                    ${s === selectedSize
                      ? "active"
                      : ""}"
                  onclick="
                    selectSize('${s}');
                    return false;
                  "
                >
                  ${s}
                </button>
              `
            ).join("")}

          </div>


          <button
            class="bigAdd"
            onclick="
              addSelectedToBag('${p.id}')
            "
          >
            ADD TO BAG — ${money(p.price)}
          </button>


          <div class="detailsLines">

            <div>
              FREE DELIVERY
              <span>
                Orders over LKR 15,000
              </span>
            </div>

            <div>
              STORE PICKUP
              <span>
                Available at Factory Outlet
              </span>
            </div>

            <div>
              RIZELLE QUALITY
              <span>
                Carefully selected materials
              </span>
            </div>

          </div>

        </div>

      </div>
    `;


  function selectSize(size) {

    selectedSize = size;

    document
      .querySelectorAll(".sizeBtn")
      .forEach(btn => {

        btn.classList.toggle(
          "active",
          btn.textContent.trim() === size
        );

      });

  }


  updateBagCount();

</script>

</body>
</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — RIZELLE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shop.css"></head><body><header><a href="index.html"><img src="assets/rizelle-logo.jpg"></a><nav id="nav"><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="index.html#outlet">FACTORY OUTLET</a><a href="index.html#story">OUR STORY</a><a href="index.html#contact">CONTACT</a></nav><div class="actions"><a href="orders.html">ORDERS</a><a href="shop.html">← SHOP</a><a href="bag.html">BAG <b data-bag-count>0</b></a><button class="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button></div></header><main id="detail" class="detail"></main><div id="toast"></div><script src="products.js"></script><script>
let selectedSize="M";
function addSelectedToBag(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;let bag=getBag(),item=bag.find(x=>x.id===id&&x.size===selectedSize);if(item)item.qty++;else bag.push({id,qty:1,size:selectedSize});saveBag(bag);toast(p.name+" (Size "+selectedSize+") added to bag.");}
const id=new URLSearchParams(location.search).get('id')||'rz-001',p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+' — RIZELLE';document.getElementById('detail').innerHTML=`<a class="back" href="shop.html">← BACK TO SHOP</a><div class="detailGrid"><div class="detailVisual productVisual ${p.tone}"><span class="monogram">R</span>${p.badge?`<b class="badge">${p.badge}</b>`:''}</div><div class="detailInfo"><small>${p.category} / ${p.color}</small><h1>${p.name}</h1><div class="price">${money(p.price)} ${p.oldPrice?`<del>${money(p.oldPrice)}</del>`:''}</div><p>${p.desc}</p><div class="sizeTitle">SELECT SIZE</div><div class="sizes">${["S","M","L","XL"].map(s=>`<button class="sizeBtn ${s===selectedSize?"active":""}" onclick="selectSize('${s}');return false;">${s}</button>`).join("")}</div><button class="bigAdd" onclick="addSelectedToBag('${p.id}')">ADD TO BAG — ${money(p.price)}</button><div class="detailsLines"><div>FREE DELIVERY <span>Orders over LKR 15,000</span></div><div>STORE PICKUP <span>Available at Factory Outlet</span></div><div>RIZELLE QUALITY <span>Carefully selected materials</span></div></div></div></div>`;function selectSize(s){selectedSize=s;document.querySelectorAll(".sizeBtn").forEach(b=>b.classList.toggle("active",b.textContent===s));}
updateBagCount();
</script></body></html>

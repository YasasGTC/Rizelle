<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RIZELLE — Shop</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="shop.css"
  >

</head>


<body>


<header class="siteHeader">

  <a
    href="index.html"
    class="brand"
  >
    RIZELLE
  </a>


  <nav>

    <a href="index.html">
      HOME
    </a>

    <a href="shop.html" class="active">
      SHOP
    </a>

    <a href="orders.html">
      ORDERS
    </a>

    <a href="bag.html">

      BAG
      (<span data-bag-count>0</span>)

    </a>

  </nav>

</header>



<main class="shopPage">


  <section class="shopHero">

    <div>

      <p class="eyebrow">
        RIZELLE COLLECTION
      </p>

      <h1>
        Shop
      </h1>

      <p class="shopIntro">
        Everyday essentials,
        refined for your style.
      </p>

    </div>


    <div class="shopTools">

      <button
        class="filterBtn active"
        data-filter="All"
      >
        ALL
      </button>

      <button
        class="filterBtn"
        data-filter="Men"
      >
        MEN
      </button>

      <button
        class="filterBtn"
        data-filter="Women"
      >
        WOMEN
      </button>

      <button
        class="filterBtn"
        data-filter="Kids"
      >
        KIDS
      </button>

      <button
        class="filterBtn"
        data-filter="Accessories"
      >
        ACCESSORIES
      </button>

    </div>

  </section>



  <section>

    <div
      id="productGrid"
      class="productGrid"
    ></div>

  </section>


</main>



<div id="toast"></div>



<script src="products.js"></script>


<script>


  const grid =
    document.getElementById(
      'productGrid'
    );


  const filterButtons =
    document.querySelectorAll(
      '.filterBtn'
    );


  let currentFilter = 'All';



  function renderProducts() {


    const products =
      currentFilter === 'All'

        ? PRODUCTS

        : PRODUCTS.filter(
            p =>
              p.category ===
              currentFilter
          );


    if (!products.length) {

      grid.innerHTML = `

        <div class="noProducts">

          <h2>
            No products found
          </h2>

          <p>
            Try another category.
          </p>

        </div>

      `;

      return;

    }


    grid.innerHTML =
      products
        .map(card)
        .join('');

  }



  filterButtons.forEach(button => {


    button.addEventListener(
      'click',
      () => {


        filterButtons.forEach(
          btn =>
            btn.classList.remove(
              'active'
            )
        );


        button.classList.add(
          'active'
        );


        currentFilter =
          button.dataset.filter;


        renderProducts();

      }
    );

  });



  updateBagCount();

  renderProducts();


</script>


</body>

</html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — RIZELLE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shop.css"></head><body>
<header><a href="index.html"><img src="assets/rizelle-logo.jpg"></a><nav id="nav"><a href="index.html">HOME</a><a class="active" href="shop.html">SHOP</a><a href="index.html#outlet">FACTORY OUTLET</a><a href="index.html#story">OUR STORY</a><a href="index.html#contact">CONTACT</a></nav><div class="actions"><a href="orders.html">ORDERS</a><button onclick="document.getElementById('search').focus()">⌕</button><a href="bag.html">BAG <b data-bag-count>0</b></a><button class="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button></div></header>
<main class="shop"><div class="shopHero"><small>RIZELLE / COLLECTION 01</small><h1>Wear your <i>statement.</i></h1><p>Explore the latest RIZELLE pieces — designed with clean lines, quiet confidence and everyday versatility.</p></div>
<div class="shopTools"><div class="categories"><button class="selected" data-cat="All">ALL</button><button data-cat="Women">WOMEN</button><button data-cat="Men">MEN</button><button data-cat="Kids">KIDS</button><button data-cat="Accessories">ACCESSORIES</button></div><div class="search"><input id="search" placeholder="Search products..."><select id="sort"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div></div>
<div id="count" class="resultCount"></div><section id="products" class="productGrid"></section></main><div id="toast"></div><script src="products.js"></script><script>
let cat='All', q=''; const grid=document.getElementById('products');
function render(){let a=PRODUCTS.filter(p=>(cat==='All'||p.category===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));let s=document.getElementById('sort').value;if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">No pieces found.<br><small>Try another search or category.</small></div>';document.getElementById('count').textContent=a.length+' PIECES'}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');cat=b.dataset.cat;render()});document.getElementById('search').oninput=e=>{q=e.target.value;render()};document.getElementById('sort').onchange=render;updateBagCount();render();
</script></body></html>

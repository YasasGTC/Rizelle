  <style>

    /* ==========================================
       SHOP HEADER
       Keep homepage sizing, adjust only position
    ========================================== */

    header {
      position: relative;
      z-index: 1000;
    }


    /*
      Keep the original logo dimensions from
      style.css / homepage.
      Only move it slightly toward the left.
    */

    header > a:first-child {
      position: relative;

      left: -8px;
    }


    /* ==========================================
       SHOP CONTENT
    ========================================== */

    .shopPage {

      position: relative;

      z-index: 1;

      width: 100%;

      padding-top: 55px;

    }


    /* ==========================================
       SHOP HERO
    ========================================== */

    .shopHero {

      position: relative;

      z-index: 2;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 40px;

      width: 100%;

      padding:
        0 0 42px;

    }


    .shopHero > div:first-child {

      position: relative;

      z-index: 3;

    }


    /* COLLECTION */

    .shopHero .eyebrow {

      position: relative;

      z-index: 3;

      display: block;

      margin:
        0 0 12px;

      line-height: 1.4;

    }


    /* TITLE */

    .shopHero h1 {

      position: relative;

      z-index: 3;

      margin: 0;

    }


    /* DESCRIPTION */

    .shopIntro {

      position: relative;

      z-index: 3;

      margin-top: 12px;

    }


    /* ==========================================
       FILTERS
    ========================================== */

    .shopTools {

      position: relative;

      z-index: 10;

      display: flex;

      align-items: center;

      justify-content: flex-end;

      flex-wrap: wrap;

      gap: 8px;

    }


    .filterBtn {

      position: relative;

      z-index: 11;

      cursor: pointer;

      transition:
        transform .3s ease,
        opacity .3s ease;

    }


    .filterBtn:hover {

      transform:
        translateY(-2px);

    }


    .filterBtn:active {

      transform:
        scale(.97);

    }


    /* ==========================================
       PRODUCT GRID
    ========================================== */

    .productGrid {

      position: relative;

      z-index: 1;

      width: 100%;

      padding-bottom: 80px;

    }


    /* ==========================================
       PRODUCT CARD ENTRANCE
    ========================================== */

    .productGrid .productCard {

      animation:
        rizelleCardEntrance
        .65s
        cubic-bezier(.2,.8,.2,1)
        both;

    }


    @keyframes rizelleCardEntrance {

      from {

        opacity: 0;

        transform:
          translateY(18px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 760px) {


      header > a:first-child {

        left: -4px;

      }


      .shopPage {

        padding-top: 32px;

      }


      .shopHero {

        display: block;

        padding-bottom: 30px;

      }


      .shopTools {

        justify-content: flex-start;

        flex-wrap: nowrap;

        overflow-x: auto;

        margin-top: 24px;

        padding-bottom: 5px;

        scrollbar-width: none;

      }


      .shopTools::-webkit-scrollbar {

        display: none;

      }


      .filterBtn {

        flex:
          0 0 auto;

      }

    }


    /* ==========================================
       REDUCED MOTION
    ========================================== */

    @media (
      prefers-reduced-motion: reduce
    ) {

      .productCard,
      .filterBtn {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>

  <script src="products.js"></script>

  <!-- SHOP JS -->

  <script>


    /* ==========================================
       SHOP ENGINE
    ========================================== */

    const productGrid =
      document.getElementById(
        'productGrid'
      );


    const filterButtons =
      document.querySelectorAll(
        '.filterBtn'
      );


    let currentFilter =
      'All';



    /* ==========================================
       RENDER
    ========================================== */

    function renderProducts() {


      const filteredProducts =

        currentFilter === 'All'

          ? PRODUCTS

          : PRODUCTS.filter(
              product =>
                product.category ===
                currentFilter
            );


      if (
        !filteredProducts.length
      ) {

        productGrid.innerHTML = `

          <div class="noProducts">

            <h2>
              No products found
            </h2>

            <p>
              Try another category.
            </p>

          </div>

        `;

        return;

      }


      productGrid.innerHTML =

        filteredProducts
          .map(card)
          .join('');


      const cards =
        productGrid.querySelectorAll(
          '.productCard'
        );


      cards.forEach(
        (card, index) => {

          card.style.animationDelay =
            `${Math.min(
              index * 0.045,
              0.5
            )}s`;

        }
      );

    }



    /* ==========================================
       FILTER
    ========================================== */

    filterButtons.forEach(
      button => {

        button.addEventListener(
          'click',
          () => {


            filterButtons.forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );


            button.classList.add(
              'active'
            );


            currentFilter =
              button.dataset.filter;


            renderProducts();

          }
        );

      }
    );



    /* ==========================================
       BAG
    ========================================== */

    if (
      typeof updateBagCount ===
      'function'
    ) {

      updateBagCount();

    }



    /* ==========================================
       INITIAL LOAD
    ========================================== */

    renderProducts();


  </script>

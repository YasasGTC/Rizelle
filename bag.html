<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bag — RIZELLE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shop.css"></head><body><header><a href="index.html"><img src="assets/rizelle-logo.jpg"></a><nav id="nav"><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="index.html#outlet">FACTORY OUTLET</a><a href="index.html#story">OUR STORY</a><a href="index.html#contact">CONTACT</a></nav><div class="actions"><a href="orders.html">ORDERS</a><a href="shop.html">CONTINUE SHOPPING</a><button class="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button></div></header><main class="bagPage"><div class="shopHero"><small>RIZELLE / YOUR BAG</small><h1>Your <i>selection.</i></h1></div><div id="bagContent"></div></main><script src="products.js"></script><script>
function renderBag(){let b=getBag(),el=document.getElementById('bagContent');if(!b.length){el.innerHTML='<div class="emptyBag"><h2>Your bag is empty.</h2><p>Find something that feels like you.</p><a class="btn dark" href="shop.html">EXPLORE COLLECTION ↗</a></div>';return}let total=0;el.innerHTML='<div class="bagList">'+b.map(i=>{let p=PRODUCTS.find(x=>x.id===i.id),sub=p.price*i.qty;total+=sub;return `<div class="bagItem"><div class="bagThumb productVisual ${p.tone}"><span class="monogram">R</span></div><div><small>${p.category}</small><h3>${p.name}</h3><p>${money(p.price)}${i.size?` · Size ${i.size}`:''}</p></div><div class="qty"><button onclick="change('${p.id}',-1)">−</button><b>${i.qty}</b><button onclick="change('${p.id}',1)">+</button></div><strong>${money(sub)}</strong><button onclick="removeItem('${p.id}')">×</button></div>`}).join('')+'</div><div class="summary"><span>SUBTOTAL</span><strong>'+money(total)+'</strong><p>Delivery charges are calculated at checkout.</p><button class="bigAdd" onclick="location.href='checkout.html'">PROCEED TO CHECKOUT →</button></div>'}
function change(id,n){let b=getBag(),i=b.find(x=>x.id===id);i.qty+=n;if(i.qty<1)b=b.filter(x=>x.id!==id);saveBag(b);renderBag()}function removeItem(id){saveBag(getBag().filter(x=>x.id!==id));renderBag()}renderBag();
</script></body></html>

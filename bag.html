<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RIZELLE — Your Bag</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bag.css">
</head>

<body>

  <header class="siteHeader">

    <a href="index.html" class="brand">
      RIZELLE
    </a>

    <nav>
      <a href="shop.html">SHOP</a>
      <a href="orders.html">ORDERS</a>

      <a href="bag.html">
        BAG (<span data-bag-count>0</span>)
      </a>
    </nav>

  </header>


  <main class="bagPage">

    <section class="bagHeader">

      <div>
        <p class="eyebrow">YOUR SELECTION</p>
        <h1>Your Bag</h1>
      </div>

      <a href="shop.html" class="continueShopping">
        ← Continue Shopping
      </a>

    </section>


    <section id="bagContainer"></section>


    <section id="bagSummary" class="bagSummary"></section>

  </main>


  <div id="toast"></div>


  <script src="products.js"></script>


  <script>

    const bagContainer =
      document.getElementById('bagContainer');

    const bagSummary =
      document.getElementById('bagSummary');


    function renderBag() {

      const bag = getBag();

      updateBagCount();


      if (!bag.length) {

        bagContainer.innerHTML = `
          <div class="emptyBag">

            <div class="emptyIcon">R</div>

            <h2>Your bag is empty</h2>

            <p>
              Looks like you haven't added anything yet.
            </p>

            <a href="shop.html" class="shopButton">
              SHOP COLLECTION
            </a>

          </div>
        `;

        bagSummary.innerHTML = '';

        return;
      }


      let subtotal = 0;


      bagContainer.innerHTML = `

        <div class="bagItems">

          ${bag.map(item => {

            const p =
              PRODUCTS.find(x => x.id === item.id);

            if (!p) return '';


            const itemTotal =
              p.price * item.qty;

            subtotal += itemTotal;


            return `

              <article class="bagItem">

                <a
                  href="product.html?id=${p.id}"
                  class="bagImage"
                  style="
                    background-image:
                    url('${p.image}');
                  "
                ></a>


                <div class="bagDetails">

                  <div>

                    <small>
                      ${p.category} · ${p.color}
                    </small>

                    <h3>
                      ${p.name}
                    </h3>

                    <p>
                      ${money(p.price)}
                    </p>

                  </div>


                  <div class="bagActions">

                    <div class="quantity">

                      <button
                        onclick="
                          changeQty('${p.id}', -1)
                        "
                      >
                        −
                      </button>


                      <span>
                        ${item.qty}
                      </span>


                      <button
                        onclick="
                          changeQty('${p.id}', 1)
                        "
                      >
                        +
                      </button>

                    </div>


                    <strong>
                      ${money(itemTotal)}
                    </strong>


                    <button
                      class="removeBtn"
                      onclick="
                        removeItem('${p.id}')
                      "
                    >
                      REMOVE
                    </button>

                  </div>

                </div>

              </article>

            `;

          }).join('')}

        </div>

      `;


      bagSummary.innerHTML = `

        <div class="summaryBox">

          <div class="summaryRow">
            <span>Subtotal</span>
            <strong>
              ${money(subtotal)}
            </strong>
          </div>


          <div class="summaryRow muted">
            <span>Shipping</span>
            <span>
              Calculated at checkout
            </span>
          </div>


          <div class="summaryTotal">
            <span>Total</span>

            <strong>
              ${money(subtotal)}
            </strong>
          </div>


          <a
            href="checkout.html"
            class="checkoutButton"
          >
            PROCEED TO CHECKOUT →
          </a>

        </div>

      `;

    }


    function changeQty(id, amount) {

      const bag = getBag();

      const item =
        bag.find(x => x.id === id);

      if (!item) return;


      item.qty += amount;


      if (item.qty <= 0) {

        const index =
          bag.findIndex(x => x.id === id);

        bag.splice(index, 1);

      }


      saveBag(bag);

      renderBag();

    }


    function removeItem(id) {

      const bag = getBag();

      const filtered =
        bag.filter(x => x.id !== id);

      saveBag(filtered);

      renderBag();

      toast('Item removed from bag.');

    }


    renderBag();

  </script>

</body>
</html>
